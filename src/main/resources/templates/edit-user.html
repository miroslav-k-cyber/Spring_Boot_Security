<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>
<body>

<!-- Кнопка Logout с автоматической генерацией CSRF токена -->
<div style="float: right; margin: 10px;">
    <form th:action="@{/logout}" method="post"> <!-- Обратите внимание: method="post" маленькими буквами без th: -->
        <input type="submit" value="Logout" style="background-color: #f44336; color: white; padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px;"/>
    </form>
</div>


<h2>Edit User</h2>

<form th:method="POST" th:action="@{/admin/update}" th:object="${user}">
    <input type="hidden" th:field="*{id}" />

    <label for="name">Name:</label>
    <input type="text" th:field="*{name}" id="name" /><br/><br/>

    <label for="lastName">Last Name:</label>
    <input type="text" th:field="*{lastName}" id="lastName" /><br/><br/>

    <label for="email">Email:</label>
    <input type="text" th:field="*{email}" id="email" /><br/><br/>

    <label for="age">Age:</label>
    <input type="number" th:field="*{age}" id="age" /><br/><br/>

    <label for="password">Password:</label>
    <input type="password" th:field="*{password}" id="password" required/><br/><br/>

    <label for="roles">Roles:</label><br/>
    <!-- Используем name="roles", чтобы Spring считал выбранные value как List<Long> roleIds -->
    <select name="roles" id="roles" multiple="multiple" size="2" required style="width: 150px;">
        <option value="1">ROLE_ADMIN</option>
        <option value="2">ROLE_USER</option>
    </select>
    <br/><br/>

    <input type="submit" value="Update User"/>
</form>

<br/>
<a th:href="@{/admin}">Cancel and Back</a>

</body>
</html>
